# Build a release when a version tag is pushed:
#     git tag v1.0.0 && git push origin v1.0.0
# Attaches sofarlogger-v1.0.0.tar.gz (the repo at that tag, without .github) to a GitHub release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the scripts and Python parse
        run: |
          bash -n install.sh deploy/*.sh deploy/optional/*.sh
          python3 -m py_compile collector/*.py tools/*.py extras/pi-monitor/monitor.py

      - name: Build the tarball
        run: |
          git archive --format=tar.gz --prefix="sofarlogger-${GITHUB_REF_NAME}/" \
            -o "sofarlogger-${GITHUB_REF_NAME}.tar.gz" "${GITHUB_REF_NAME}"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "sofarlogger-${GITHUB_REF_NAME}.tar.gz" \
            --title "sofarlogger ${GITHUB_REF_NAME}" --generate-notes
