<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solar Overview</title>
<link rel="stylesheet" href="style.css?v=3">
<style>
  /* At a glance: the same four figures as the Pi monitor screen */
  .kpi .k { font-weight: 600; }
  .kpi.solar .k { color: #d69e2e; } .kpi.house .k { color: #3b7dd8; } .kpi.battery .k { color: #1f9d55; }
  .kpi.grid .k { color: var(--muted); }
  .kpi .v.import { color: #c0392b; } .kpi .v.export { color: #1f9d55; }
  .kpi .v.stale { color: var(--muted); }
  .kpi .sub.import { color: #c0392b; } .kpi .sub.export { color: #1f9d55; }
  .kpi .socbar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin: 4px 0 3px; max-width: 160px; }
  .kpi .socbar span { display: block; height: 100%; background: #1f9d55; }
  .kpi .socbar span.low { background: #c0392b; }
</style>
</head>
<body>
<noscript><div style="margin:8px 16px;padding:10px 14px;border:1px solid #c0392b;border-radius:8px;color:#c0392b">JavaScript is turned off in this browser, so live data and charts cannot load. Turn JavaScript on for this site (e.g. Samsung Internet: Settings, Sites and downloads, or disable content blockers for this site).</div></noscript>
<header>
  <h1 id="siteName">☀ Solar</h1>
  <nav class="top"><a href="savings.html">Savings</a> · <a href="green.html">🌿 Going Green</a> · <a href="admin/admin.php">Admin</a> · <span class="updated" id="updated">Loading…</span></nav>
</header>
<main>
  <section class="card kpis" id="kpis"></section>

  <section>
    <div class="section-head"><h2>Equipment</h2><span class="updated" id="sunInfo"></span></div>
    <div class="tiles" id="tiles"></div>
  </section>

  <section id="retiredSection" hidden>
    <div class="section-head"><h2>Retired equipment</h2></div>
    <div class="tiles" id="retiredTiles"></div>
  </section>

  <section class="card">
    <div class="section-head">
      <h2>Site power — <span id="dayLabel"></span></h2>
      <div class="controls">
        <button id="prevDay" aria-label="Previous day">◀</button>
        <input type="date" id="dayPicker">
        <button id="nextDay" aria-label="Next day">▶</button>
        <button id="today">Today</button>
      </div>
    </div>
    <div class="chart-box"><canvas id="dayChart"></canvas></div>
    <div class="summary" id="daySummary"></div>
  </section>

  <section class="card">
    <div class="section-head">
      <h2>Daily energy</h2>
      <div class="controls" id="rangeBtns">
        <button data-days="7">7 days</button>
        <button data-days="30" class="active">30 days</button>
        <button data-days="90">90 days</button>
        <button data-days="365">1 year</button>
      </div>
    </div>
    <div class="chart-box"><canvas id="dailyChart"></canvas></div>
    <div class="summary" id="dailySummary"></div>
  </section>

  <section class="card">
    <div class="section-head"><h2>Monthly energy — all history</h2></div>
    <div class="chart-box"><canvas id="monthlyChart"></canvas></div>
    <div class="summary" id="monthlySummary"></div>
  </section>

  <section class="card">
    <div class="section-head">
      <h2>Export CSV (all equipment)</h2>
      <form class="controls" action="api.php" method="get">
        <input type="hidden" name="action" value="csv">
        <label>From <input type="date" name="from" id="csvFrom"></label>
        <label>To <input type="date" name="to" id="csvTo"></label>
        <button type="submit">Download</button>
      </form>
    </div>
  </section>
</main>

<script src="chart.umd.min.js?v=3"></script>
<script src="common.js?v=4"></script>
<script>
let names = {}, dayChart, dailyChart, monthlyChart, days = 30;

function retiredTile(d) {
  const r = d.latest;
  const span = d.first_ts && r ? `${monthStr(d.first_ts)} – ${monthStr(r.ts)}` : 'No history imported';
  return `<a class="card tile retired" href="device.html?id=${encodeURIComponent(d.id)}">
    <div class="tile-head">
      <div><div class="tile-name"><span class="swatch" style="background:${colorFor(d.id)}"></span>${TYPE_ICON[d.type] || '•'} ${esc(d.name)}</div>
           <div class="tile-meta">${esc(d.type)}${d.rated_w ? ' · ' + (d.rated_w / 1000) + ' kW' : ''}</div></div>
      ${badge(d.state)}
    </div>
    <div class="tile-power stale">${r ? fmt(r.energy_total_kwh / 1000, 2) : '—'} <small>MWh produced</small></div>
    <div class="tile-foot"><span>${esc(span)}</span><span>History →</span></div>
  </a>`;
}

function batteryTile(d) {
  const r = d.latest, v = r ? r.data : {};
  const pct = Math.max(0, Math.min(100, v.soc || 0));
  const w = v.batt_power_w;
  const flow = w === undefined ? '—' : w < 0 ? `Discharging ${Math.abs(w)} W` : w > 0 ? `Charging ${w} W` : 'Idle';
  return `<a class="card tile" href="device.html?id=${encodeURIComponent(d.id)}">
    <div class="tile-head">
      <div><div class="tile-name"><span class="swatch" style="background:${colorFor(d.id)}"></span>${TYPE_ICON[d.type] || '•'} ${esc(d.name)}</div>
           <div class="tile-meta">${esc(d.type)}${d.location ? ' · ' + esc(d.location) : ''}${d.rated_w ? ' · ' + (d.rated_w / 1000) + ' kW' : ''}</div></div>
      ${badge(d.state)}
    </div>
    <div class="tile-power ${d.state === 'online' ? '' : 'stale'}">${fmt(v.soc, 0)} <small>%</small></div>
    <div class="bar"><span style="width:${pct}%;background:${colorFor(d.id)}"></span></div>
    <div class="tile-foot"><span>${esc(flow)}${v.faults && v.faults !== 'None' ? ' · Fault ' + esc(v.faults) : ''}</span><span>${r ? 'Seen ' + timeStr(r.ts) : 'No readings yet'}</span></div>
  </a>`;
}

function tile(d) {
  if (d.type === 'battery') return batteryTile(d);
  const r = d.latest;
  const pct = d.rated_w && d.power_w ? Math.min(100, d.power_w / d.rated_w * 100) : 0;
  const power = d.power_w === null ? '—' : Math.round(d.power_w);
  return `<a class="card tile" href="device.html?id=${encodeURIComponent(d.id)}">
    <div class="tile-head">
      <div><div class="tile-name"><span class="swatch" style="background:${colorFor(d.id)}"></span>${TYPE_ICON[d.type] || '•'} ${esc(d.name)}</div>
           <div class="tile-meta">${esc(d.type)}${d.location ? ' · ' + esc(d.location) : ''}${d.rated_w ? ' · ' + (d.rated_w / 1000) + ' kW' : ''}</div></div>
      ${badge(d.state)}
    </div>
    <div class="tile-power ${d.state === 'online' ? '' : 'stale'}">${power} <small>W</small></div>
    <div class="bar"><span style="width:${pct}%;background:${colorFor(d.id)}"></span></div>
    <div class="tile-foot"><span>Today ${fmt(d.energy_today_kwh, 2)} kWh</span><span>${r ? 'Seen ' + timeStr(r.ts) : 'No readings yet'}</span></div>
  </a>`;
}

// "At a glance": solar, house, battery and grid, worked out the same way as the Pi monitor (extras/pi-monitor).
const kw = w => w === null || w === undefined ? ['—', '']
  : Math.abs(w) >= 1000 ? [(Math.abs(w) / 1000).toFixed(2), 'kW'] : [String(Math.round(Math.abs(w))), 'W'];
const kwShort = w => Math.abs(w) >= 1000 ? (Math.abs(w) / 1000).toFixed(1) + ' kW' : Math.round(Math.abs(w)) + ' W';

function glance(s) {
  const devs = s.devices.filter(d => !d.retired);
  const online = d => !!d && d.state === 'online';
  const data = d => (d && d.latest && d.latest.data) || {};
  const inverters = devs.filter(d => d.type === 'inverter');
  const mes = devs.filter(d => d.driver === 'me3000');
  const byId = Object.fromEntries(devs.map(d => [d.id, d]));
  // The unit whose CT is on the grid cable gives the grid and solar figures (both CTs sit there if two have one).
  const ctUnit = mes.find(m => m.has_ct !== false && online(m)) || null;
  const t = s.totals;
  const night = inverters.length && inverters.every(d => d.state === 'night');
  const solarW = night ? 0 : inverters.some(online) ? t.power_w : null;
  const card = (cls, label, w, sub, vcls = '') => {
    const [n, u] = Array.isArray(w) ? w : kw(w);
    return `<div class="kpi ${cls}"><div class="k">${label}</div>
      <div class="v ${n === '—' ? 'stale' : vcls}">${n} <small>${u}</small></div>${sub || ''}</div>`;
  };
  const out = [];

  const pct = t.rated_w && solarW !== null ? Math.round(solarW / t.rated_w * 100) : null;
  out.push(card('solar', '☀ Solar', solarW, `<div class="sub">Today ${fmt(t.energy_today_kwh, 2)} kWh${
    pct !== null ? ` · ${pct}% of ${t.rated_w / 1000} kW` : ''}</div>`));

  if (mes.length) {
    // One unit: its own house figure. Two: the CT unit's figure counts only its own battery output, so add the
    // others' output (and their net battery energy for today).
    let houseW = null, houseToday = null;
    if (ctUnit) {
      const c = data(ctUnit), others = mes.filter(m => m !== ctUnit);
      houseW = c.load_w + others.reduce((a, m) => a + (online(m) ? (data(m).inverter_w || 0) : 0), 0);
      houseToday = c.load_today === undefined ? null : c.load_today +
        others.reduce((a, m) => a + (data(m).discharge_today || 0) - (data(m).charge_today || 0), 0);
    }
    out.push(card('house', '🏠 House', houseW, `<div class="sub">Today ${fmt(houseToday, 2)} kWh</div>`));
  }

  // Batteries: each ME3000SP with its linked BMS, plus any BMS not linked to one.
  const allBms = devs.filter(d => d.driver === 'jbd');
  const bmsOf = m => 'bms' in m ? m.bms : (mes.length === 1 && allBms.length === 1 ? allBms[0].id : null);   // older API
  const linked = new Set(mes.map(bmsOf).filter(Boolean));
  const packs = mes.map(m => ({ name: m.name, me: m, bms: byId[bmsOf(m)] || null }))
    .concat(allBms.filter(d => !linked.has(d.id)).map(b => ({ name: b.name, me: null, bms: b })));
  if (packs.length) {
    const read = p => {
      const src = online(p.bms) ? p.bms : online(p.me) ? p.me : null, b = data(src);
      return { soc: src ? b.soc : null, w: src ? b.batt_power_w : null, est: !!src && src !== p.bms,
               kwh: src && src === p.bms && b.remaining_ah && b.batt_v ? b.remaining_ah * b.batt_v / 1000 : null,
               full: src && src === p.bms && b.full_ah && b.batt_v ? b.full_ah * 51.2 / 1000 : null };
    };
    const flow = w => w === null || w === undefined ? '—' : Math.abs(w) < 30 ? 'Idle'
      : w > 0 ? `Charging ${kwShort(w)}` : `Supplying ${kwShort(w)}`;
    const bar = soc => soc === null || soc === undefined ? '' :
      `<div class="socbar"><span class="${soc <= 20 ? 'low' : ''}" style="width:${Math.max(0, Math.min(100, soc))}%"></span></div>`;
    const r = packs.map(read);
    if (packs.length === 1) {
      const x = r[0];
      out.push(card('battery', '🔋 Battery', x.soc === null || x.soc === undefined ? ['—', ''] : [String(x.soc), x.est ? '% est' : '%'],
        `${bar(x.soc)}<div class="sub">${flow(x.w)}${x.kwh !== null ? ` · ${x.kwh.toFixed(1)} kWh stored` : ''}</div>`));
    } else {
      // Combined: weighted by capacity when every pack has a BMS reading, else a plain average.
      const known = r.filter(x => x.soc !== null && x.soc !== undefined);
      const weighted = known.length === r.length && r.every(x => x.full);
      const soc = !known.length ? null : Math.round(weighted
        ? r.reduce((a, x) => a + x.kwh, 0) / r.reduce((a, x) => a + x.full, 0) * 100
        : known.reduce((a, x) => a + x.soc, 0) / known.length);
      const stored = r.every(x => x.kwh !== null) ? ` · ${r.reduce((a, x) => a + x.kwh, 0).toFixed(1)} kWh stored` : '';
      const lines = packs.map((p, i) => `<div class="sub">${esc(p.name)}: ${r[i].soc ?? '—'}${r[i].est ? '% est' : '%'} · ${flow(r[i].w)}</div>`).join('');
      out.push(card('battery', `🔋 Batteries (${packs.length})`, soc === null ? ['—', ''] : [String(soc), weighted ? '%' : '% avg'],
        `${bar(soc)}${lines}<div class="sub">${stored.replace(' · ', '')}</div>`));
    }
  }

  if (mes.length) {
    const m = data(ctUnit), g = ctUnit ? m.grid_w : null;   // + export / - import
    const today = m.bought_today !== undefined ? `Today ${fmt(m.bought_today, 1)} in · ${fmt(m.sold_today, 1)} out kWh` : '';
    if (g === null || g === undefined) out.push(card('grid', '⚡ Grid', null, `<div class="sub">${today}</div>`));
    else if (Math.abs(g) < 30) out.push(card('grid', '⚡ Grid', ['0', 'W'], `<div class="sub">Not using the grid · ${today}</div>`));
    else {
      const exp = g > 0;
      out.push(card('grid', '⚡ Grid', g, `<div class="sub ${exp ? 'export' : 'import'}">${exp ? 'Exporting' : 'Importing'}</div>
        <div class="sub">${today}</div>`, exp ? 'export' : 'import'));
    }
  }
  return out.join('');
}

async function loadSite() {
  try {
    const s = await getJSON('api.php?action=site');
    assignColors(s.devices);
    names = Object.fromEntries(s.devices.map(d => [d.id, d.name]));
    document.title = s.site.name;
    document.getElementById('siteName').textContent = '☀ ' + s.site.name;
    document.getElementById('kpis').innerHTML = glance(s);
    const t = s.totals;
    const active = s.devices.filter(d => !d.retired), retired = s.devices.filter(d => d.retired);
    document.getElementById('tiles').innerHTML = active.length ? active.map(tile).join('')
      : '<div class="card empty">No active equipment configured.</div>';
    document.getElementById('retiredSection').hidden = !retired.length;
    document.getElementById('retiredTiles').innerHTML = retired.map(retiredTile).join('');
    document.getElementById('sunInfo').textContent = [`${t.online} of ${t.count} online`,
      s.site.daylight ? 'Daylight' : 'Night: inverters sleep',
      s.site.sunrise ? `Sunrise ${timeStr(s.site.sunrise)} · Sunset ${timeStr(s.site.sunset)}` : ''].filter(Boolean).join(' · ');
    document.getElementById('updated').textContent = 'Updated ' + new Date().toLocaleTimeString('en-NZ');
  } catch (e) {
    if (e.network) return;   // the connection bar shows it; keep the last figures
    document.getElementById('updated').textContent = 'Cannot reach the Pi API';
  }
}

const nav = dayNavigator(async date => {
  const d = await getJSON(`api.php?action=day&date=${isoDate(date)}`);
  const res = renderDayChart(document.getElementById('dayChart'), dayChart, d, names, true);
  dayChart = res.chart;
  const parts = Object.entries(res.byDevice).map(([id, rs]) =>
    `${names[id] || id}: ${Math.max(...rs.map(r => r.energy_today_kwh || 0)).toFixed(2)} kWh`);
  document.getElementById('daySummary').textContent = parts.length ? parts.join(' · ') : 'No readings for this day.';
});

async function loadDaily() {
  const d = await getJSON(`api.php?action=daily&days=${days}`);
  const res = renderDailyChart(document.getElementById('dailyChart'), dailyChart, d, days, names);
  dailyChart = res.chart;
  document.getElementById('dailySummary').textContent = `Site total ${res.total.toFixed(1)} kWh over ${days} days`;
}
async function loadMonthly() {
  const d = await getJSON('api.php?action=monthly');
  const res = renderMonthlyChart(document.getElementById('monthlyChart'), monthlyChart, d, names);
  monthlyChart = res.chart;
  document.getElementById('monthlySummary').textContent = res.months
    ? `${(res.total / 1000).toFixed(2)} MWh over ${res.months} months, all equipment including retired` : 'No history yet.';
}
rangeButtons(n => { days = n; loadDaily(); });
initCsvForm();

loadSite().then(() => { nav.start(); loadDaily(); loadMonthly(); });
window.solarRetry = () => { loadSite(); if (nav.isToday()) nav.refresh(); };
setInterval(window.solarRetry, 30000);
</script>
</body>
</html>
