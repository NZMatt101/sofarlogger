# Solar logger: password-protect the admin page and hide shared PHP includes.
<Directory /var/www/html/admin>
    AuthType Basic
    AuthName "Solar logger admin"
    AuthUserFile /etc/solar-logger/admin.htpasswd
    Require valid-user
</Directory>

<Directory /var/www/html/inc>
    Require all denied
</Directory>

# Make browsers revalidate pages and scripts so updates show up immediately (tablets cache aggressively).
<IfModule mod_headers.c>
    <FilesMatch "\.(html|js|css)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>
</IfModule>
