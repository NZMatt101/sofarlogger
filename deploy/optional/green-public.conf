# Public Going Green figures, served only to the Tailscale Funnel (which proxies to 127.0.0.1:8081).
# Everything except /api.php?action=green is refused, so the dashboard and admin stay private.
Listen 127.0.0.1:8081

<VirtualHost 127.0.0.1:8081>
    DocumentRoot /var/www/html

    <Location />
        Require expr "%{REQUEST_URI} == '/api.php' && %{QUERY_STRING} == 'action=green'"
    </Location>

    Header always set Cache-Control "no-store"
    Header always set X-Content-Type-Options "nosniff"

    ErrorLog ${APACHE_LOG_DIR}/green-public-error.log
    CustomLog ${APACHE_LOG_DIR}/green-public-access.log combined
</VirtualHost>
