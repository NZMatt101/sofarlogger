<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Going Green</title>
<link rel="stylesheet" href="style.css?v=3">
<style>
  :root { --leaf: #1f8a4c; --leaf-soft: #e6f4ea; --leaf-line: #bfe3cb; --sun: #e8a317; }
  @media (prefers-color-scheme: dark) {
    :root { --leaf: #4fd18b; --leaf-soft: #13261b; --leaf-line: #23432f; --sun: #f2b632; }
  }
  body { background: linear-gradient(180deg, var(--leaf-soft), var(--bg) 420px); }
  .hero { text-align: center; padding: 8px 0 4px; }
  .hero h1 { font-size: 30px; color: var(--leaf); }
  .hero p { color: var(--muted); margin: 6px auto 0; max-width: 640px; }
  .card.leaf { border-color: var(--leaf-line); }
  .big { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); text-align: center; }
  .big .k { color: var(--muted); font-size: 14px; }
  .big .v { font-size: 40px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--leaf); line-height: 1.15; }
  .big .v small { font-size: 18px; font-weight: 500; color: var(--muted); }
  .big .sub { color: var(--muted); font-size: 13px; }
  .big .now .v { color: var(--sun); }
  .big .v.dim { color: var(--muted); font-size: 24px; padding: 8px 0; }
  .impact { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
  .eq { display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: 10px; background: var(--leaf-soft); }
  .eq .ico { font-size: 34px; line-height: 1; }
  .eq .v { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .eq .k { color: var(--muted); font-size: 13px; }
  .sys { display: flex; flex-wrap: wrap; gap: 8px 28px; justify-content: center; color: var(--muted); }
  .sys strong { color: var(--text); }
  footer.note { max-width: 1100px; margin: 0 auto; padding: 0 16px 32px; font-size: 12px; }
  @media (max-width: 420px) { .big .v { font-size: 32px; } .hero h1 { font-size: 24px; } }
</style>
</head>
<body>
<noscript><div style="margin:8px 16px;padding:10px 14px;border:1px solid #c0392b;border-radius:8px;color:#c0392b">JavaScript is turned off in this browser, so live data cannot load.</div></noscript>
<header>
  <div class="crumbs"><a href="./" id="siteLink">← Overview</a></div>
  <nav class="top"><a href="./">Overview</a> · <a href="savings.html">Savings</a> · <span class="updated" id="updated">Loading…</span></nav>
</header>
<main>
  <section class="hero">
    <h1 id="heading">🌿 Powered by the sun</h1>
    <p id="message" hidden></p>
  </section>

  <section class="card leaf big" id="big"></section>

  <section class="card leaf">
    <div class="section-head"><h2>🌱 Today's difference</h2></div>
    <div class="impact" id="impactToday"></div>
  </section>

  <section class="card leaf">
    <div class="section-head"><h2>🌳 Lifetime difference</h2><span class="updated" id="lifeKwh"></span></div>
    <div class="impact" id="impactLife"></div>
  </section>

  <section class="card leaf" id="sysCard" hidden>
    <div class="sys" id="sys"></div>
  </section>
</main>
<footer class="note" id="footnote"></footer>

<script src="common.js?v=3"></script>
<script>
const num = (v, d = 0) => Number(v || 0).toLocaleString('en-NZ', { minimumFractionDigits: d, maximumFractionDigits: d });
const co2Str = kg => kg >= 1000 ? `${num(kg / 1000, kg >= 10000 ? 1 : 2)} <small>tonnes</small>` : `${num(kg, kg < 10 ? 1 : 0)} <small>kg</small>`;
const energyStr = kwh => kwh >= 10000 ? `${num(kwh / 1000, 1)} <small>MWh</small>` : `${num(kwh, kwh < 100 ? 1 : 0)} <small>kWh</small>`;
// Home running time, scaled to a readable unit.
function homeStr(days) {
  if (days === null) return null;
  if (days < 1) return `${num(days * 24, 1)} hours`;
  if (days < 60) return `${num(days, days < 10 ? 1 : 0)} days`;
  if (days < 730) return `${num(days / 30.4, 0)} months`;
  return `${num(days / 365, 1)} years`;
}
const eq = (ico, v, k) => v === null ? '' : `<div class="eq"><div class="ico">${ico}</div><div><div class="v">${v}</div><div class="k">${k}</div></div></div>`;

function impactHtml(x, s, perDay) {
  // Today: trees as "a day's absorption"; lifetime: "growing for a year".
  const treeKg = s.tree_kg_per_year;
  const trees = treeKg > 0 ? (perDay ? x.co2_kg / (treeKg / 365) : x.trees) : null;
  return eq('☁️', co2Str(x.co2_kg), 'CO₂ kept out of the air') +
    eq('🌳', trees === null ? null : num(trees, trees < 10 ? 1 : 0),
       perDay ? 'trees — what they absorb in a day' : 'trees — what they absorb in a year') +
    eq('🚗', x.car_km === null ? null : `${num(x.car_km, x.car_km < 10 ? 1 : 0)} <small>km</small>`, 'of driving avoided') +
    eq('🏠', homeStr(x.home_days), 'running an average NZ home');
}

async function load() {
  const g = await getJSON('api.php?action=green');
  const s = g.settings;
  document.title = `Going Green · ${g.name}`;
  document.getElementById('siteLink').textContent = '← ' + g.name;
  document.getElementById('heading').textContent = '🌿 ' + (s.heading || 'Powered by the sun');
  const msg = document.getElementById('message');
  msg.hidden = !s.message; msg.textContent = s.message || '';

  let nowV, nowSub;
  if (g.state === 'online') {
    nowV = `${num(g.now_kw, 2)} <small>kW</small>`;
    nowSub = 'from the sun right now';
  } else if (g.state === 'night') {
    nowV = '<span class="v dim">🌙 Resting</span>';
    nowSub = g.sunrise ? `the sun's down · back about ${timeStr(g.sunrise + 86400 * (Date.now() / 1000 > g.sunrise ? 1 : 0))}` : "the sun's down";
  } else {
    nowV = '<span class="v dim">No recent data</span>';
    nowSub = g.last_reading ? `last reading ${dateTimeStr(g.last_reading)}` : 'waiting for readings';
  }
  document.getElementById('big').innerHTML = `
    <div class="now"><div class="k">☀ Power now</div><div class="v">${nowV}</div><div class="sub">${nowSub}</div></div>
    <div><div class="k">🌱 Today</div><div class="v">${energyStr(g.today.kwh)}</div><div class="sub">clean energy generated</div></div>
    <div><div class="k">🌳 Lifetime</div><div class="v">${energyStr(g.lifetime.kwh)}</div>
      <div class="sub">${g.system.since ? 'since ' + new Date(g.system.since + 'T12:00').toLocaleDateString('en-NZ', { month: 'long', year: 'numeric' }) : 'clean energy generated'}</div></div>`;

  document.getElementById('impactToday').innerHTML = impactHtml(g.today, s, true);
  document.getElementById('impactLife').innerHTML = impactHtml(g.lifetime, s, false);
  document.getElementById('lifeKwh').textContent = `${num(g.lifetime.kwh)} kWh`;

  const sys = g.system, bits = [];
  if (sys.panels) bits.push(`<span>☀ <strong>${num(sys.panels)}</strong> solar panels${sys.panel_w ? ` × ${num(sys.panel_w)} W` : ''}</span>`);
  if (sys.kwp) bits.push(`<span>⚡ <strong>${num(sys.kwp, 2)} kW</strong> array</span>`);
  if (sys.since) {
    const yrs = (Date.now() - new Date(sys.since + 'T00:00')) / (365.25 * 86400000);
    bits.push(`<span>📅 Generating for <strong>${yrs >= 1 ? num(yrs, 1) + ' years' : num(yrs * 12, 0) + ' months'}</strong></span>`);
  }
  document.getElementById('sys').innerHTML = bits.join('');
  document.getElementById('sysCard').hidden = !bits.length;

  document.getElementById('footnote').innerHTML = `<p class="note">Figures are estimates. CO₂ uses the NZ grid average of ${s.co2_kg_per_kwh} kg per kWh;
    a tree absorbs about ${s.tree_kg_per_year} kg of CO₂ a year; an average petrol car emits ${s.car_kg_per_km} kg per km;
    an average NZ home uses ${s.home_kwh_per_day} kWh a day.</p>`;
  document.getElementById('updated').textContent = 'Updated ' + timeStr(g.now);
}

load();
setInterval(() => load().catch(() => {}), 60000);
</script>
</body>
</html>
